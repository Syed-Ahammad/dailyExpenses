<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dirham — Expense & VAT Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14201c;
    --paper: #f4f1e8;
    --card: #fffefa;
    --sand: #e8e3d4;
    --green: #1f5c45;
    --green-soft: #d9e7df;
    --gold: #b8862f;
    --amber-bg: #fbeccb;
    --amber-ink: #8a5a10;
    --red-bg: #f6d9d3;
    --red-ink: #97331f;
    --muted: #7c8079;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Spline Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Header */
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .logo {
    font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600;
    color: var(--green); letter-spacing: -0.02em;
  }
  .logo span { color: var(--gold); }
  .tagline { font-size: 13px; color: var(--muted); }
  .month-pill {
    background: var(--green); color: #fff; font-size: 13px; font-weight: 500;
    padding: 7px 16px; border-radius: 999px;
  }
  .divider { height: 1px; background: var(--sand); margin: 20px 0 26px; }

  /* Warnings */
  .warn {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-radius: 12px; font-size: 14px; font-weight: 500; margin-bottom: 10px;
  }
  .warn.over { background: var(--red-bg); color: var(--red-ink); }
  .warn.near { background: var(--amber-bg); color: var(--amber-ink); }
  .warn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 22px 0 30px; }
  .stat {
    background: var(--card); border: 1px solid var(--sand); border-radius: 16px;
    padding: 18px 16px; position: relative; overflow: hidden;
  }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat .value { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; }
  .stat.feature { background: var(--green); color: #fff; }
  .stat.feature .label { color: var(--green-soft); }
  .stat .currency { font-size: 13px; color: var(--muted); font-family: 'Spline Sans'; font-weight: 500; }
  .stat.feature .currency { color: var(--green-soft); }

  /* Two column layout */
  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; }
  .panel {
    background: var(--card); border: 1px solid var(--sand); border-radius: 18px; padding: 22px;
  }
  .panel h2 {
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600;
    margin-bottom: 16px; letter-spacing: -0.01em;
  }

  /* Form */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 9px; border: 1px solid var(--sand); background: var(--paper);
    border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: all .15s;
  }
  .seg button.active { background: var(--green); color: #fff; border-color: var(--green); }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--sand); border-radius: 9px;
    font-family: inherit; font-size: 14px; background: var(--paper); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--green-soft); border-color: var(--green); }
  .ai-hint {
    font-size: 12px; color: var(--green); margin-top: 5px; display: none;
  }
  .ai-hint.show { display: block; }
  .submit {
    width: 100%; padding: 12px; background: var(--green); color: #fff; border: none;
    border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 4px; transition: opacity .15s;
  }
  .submit:hover { opacity: .9; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Category bars */
  .cat { margin-bottom: 14px; }
  .cat-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .cat-top .amt { font-weight: 600; }
  .bar { height: 7px; background: var(--sand); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--green); }
  .bar i.warn { background: var(--gold); }
  .bar i.over { background: #b14228; }
  .cat-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Recent list */
  .txn { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--sand); }
  .txn:last-child { border-bottom: none; }
  .txn .ic {
    width: 34px; height: 34px; border-radius: 9px; background: var(--green-soft);
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
  }
  .txn .ic.inc { background: var(--green); }
  .txn .info { flex: 1; min-width: 0; }
  .txn .info .n { font-size: 14px; font-weight: 500; }
  .txn .info .s { font-size: 12px; color: var(--muted); }
  .txn .amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .txn .amt.inc { color: var(--green); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 999px;
    font-size: 13px; font-weight: 500; transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 820px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Dir<span>ham</span></div>
      <div class="tagline">Expense &amp; VAT tracking for UAE freelancers</div>
    </div>
    <div class="month-pill" id="monthPill">May 2026</div>
  </header>
  <div class="divider"></div>

  <div id="warnings"></div>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div>
      <div class="panel" style="margin-bottom:22px">
        <h2>Add Entry</h2>
        <div class="field">
          <div class="seg">
            <button class="active" data-type="expense" onclick="setType(this,'expense')">Expense</button>
            <button data-type="income" onclick="setType(this,'income')">Income</button>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Amount (AED)</label>
            <input type="number" id="amount" placeholder="0.00" />
          </div>
          <div class="field">
            <label>Payment Method</label>
            <select id="method">
              <option>card</option><option>cash</option>
              <option>bank_transfer</option><option>wallet</option><option>cheque</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Note</label>
          <input type="text" id="note" placeholder="e.g. Careem ride to client meeting" oninput="aiSuggest()" />
          <div class="ai-hint" id="aiHint"></div>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="category">
            <option>Food &amp; Dining</option><option>Transport</option>
            <option>Rent &amp; Utilities</option><option>Software &amp; Subscriptions</option>
            <option>Office Supplies</option><option>Marketing &amp; Advertising</option>
            <option>Professional Services</option><option>Travel</option>
            <option>Salaries &amp; Contractors</option><option>Bank &amp; Fees</option><option>Other</option>
          </select>
        </div>
        <button class="submit" onclick="addEntry()">Add Entry</button>
      </div>

      <div class="panel">
        <h2>Recent Activity</h2>
        <div id="recent"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Spending by Category</h2>
      <div id="cats"></div>
    </div>
  </div>

  <footer>Interactive preview &middot; demo data only &middot; not connected to a database</footer>
</div>
<div class="toast" id="toast">Entry added</div>

<script>
// ----- Demo state (in-memory only; resets on reload) -----
let type = "expense";
const budgets = {
  "Transport": 80000, "Food & Dining": 120000,
  "Software & Subscriptions": 60000, "Marketing & Advertising": 150000,
};
let txns = [
  { type:"income",  cat:"Professional Services", amt:1850000, method:"bank_transfer", note:"Client invoice — Acme Co", icon:"↑" },
  { type:"expense", cat:"Software & Subscriptions", amt:5499, method:"card", note:"Figma annual", icon:"☰" },
  { type:"expense", cat:"Transport", amt:3400, method:"wallet", note:"Careem to DIFC", icon:"→" },
  { type:"expense", cat:"Food & Dining", amt:8700, method:"card", note:"Client lunch", icon:"◉" },
  { type:"expense", cat:"Marketing & Advertising", amt:45000, method:"card", note:"Instagram ads", icon:"▲" },
];

// crude keyword "AI" categorization for the preview only
const rules = [
  [/careem|uber|taxi|metro|fuel|petrol/i, "Transport"],
  [/figma|adobe|notion|slack|github|subscription|saas/i, "Software & Subscriptions"],
  [/lunch|dinner|coffee|restaurant|cafe/i, "Food & Dining"],
  [/ads?|marketing|instagram|google ads|promo/i, "Marketing & Advertising"],
  [/rent|dewa|utility|electricity|water/i, "Rent & Utilities"],
  [/invoice|client|consulting|retainer/i, "Professional Services"],
];

function aed(minor){
  return new Intl.NumberFormat('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(minor/100);
}
function setType(btn,t){
  type=t;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function aiSuggest(){
  const note=document.getElementById('note').value;
  const hint=document.getElementById('aiHint');
  for(const [re,cat] of rules){
    if(re.test(note)){
      document.getElementById('category').value=cat;
      hint.textContent="✨ AI suggested: "+cat;
      hint.classList.add('show');
      return;
    }
  }
  hint.classList.remove('show');
}
function render(){
  // totals
  const exp = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amt,0);
  const inc = txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amt,0);
  const stats=[
    {label:"Today", val:exp*0.18},
    {label:"This Week", val:exp*0.55},
    {label:"This Month", val:exp},
    {label:"Income", val:inc},
    {label:"Balance", val:inc-exp, feature:true},
  ];
  document.getElementById('stats').innerHTML=stats.map(s=>`
    <div class="stat ${s.feature?'feature':''}">
      <div class="label">${s.label}</div>
      <div class="value"><span class="currency">AED</span> ${aed(s.val)}</div>
    </div>`).join('');

  // category breakdown
  const byCat={};
  txns.filter(t=>t.type==='expense').forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  document.getElementById('cats').innerHTML=cats.map(([c,amt])=>{
    const lim=budgets[c];
    let pct = lim ? Math.min((amt/lim)*100,100) : 35;
    let cls = lim ? (amt>=lim?'over':(amt/lim>=0.8?'warn':'')) : '';
    let meta = lim ? `${Math.round((amt/lim)*100)}% of AED ${aed(lim)} budget` : 'No budget set';
    return `<div class="cat">
      <div class="cat-top"><span>${c}</span><span class="amt">AED ${aed(amt)}</span></div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="cat-meta">${meta}</div>
    </div>`;
  }).join('');

  // warnings
  const warns=[];
  cats.forEach(([c,amt])=>{
    const lim=budgets[c]; if(!lim) return;
    if(amt>=lim) warns.push({c,level:'over',pct:Math.round(amt/lim*100)});
    else if(amt/lim>=0.8) warns.push({c,level:'near',pct:Math.round(amt/lim*100)});
  });
  document.getElementById('warnings').innerHTML=warns.map(w=>`
    <div class="warn ${w.level}">
      <span class="dot"></span>
      ${w.level==='over'
        ? `Over budget &mdash; ${w.c} is at ${w.pct}% of its monthly limit`
        : `Heads up &mdash; ${w.c} is at ${w.pct}% of its monthly limit`}
    </div>`).join('');

  // recent
  document.getElementById('recent').innerHTML=txns.slice(0,6).map(t=>`
    <div class="txn">
      <div class="ic ${t.type==='income'?'inc':''}">${t.icon||'☰'}</div>
      <div class="info">
        <div class="n">${t.note||t.cat}</div>
        <div class="s">${t.cat} &middot; ${t.method}</div>
      </div>
      <div class="amt ${t.type==='income'?'inc':''}">
        ${t.type==='income'?'+':'−'} AED ${aed(t.amt)}
      </div>
    </div>`).join('');
}
function addEntry(){
  const amt=parseFloat(document.getElementById('amount').value);
  if(!amt||amt<=0) return;
  txns.unshift({
    type, cat:document.getElementById('category').value,
    amt:Math.round(amt*100), method:document.getElementById('method').value,
    note:document.getElementById('note').value, icon:type==='income'?'↑':'☰'
  });
  document.getElementById('amount').value='';
  document.getElementById('note').value='';
  document.getElementById('aiHint').classList.remove('show');
  const toast=document.getElementById('toast');
  toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800);
  render();
}
render();
</script>
</body>
</html>
